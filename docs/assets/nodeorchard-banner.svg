<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">NodeOrchard — Local-first AI workflows</title>
  <desc id="description">NodeOrchard connects reusable Skills and tools in parallel workflows with human review. A branching node diagram appears beside the project name.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#EAF1DE" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#153D32"/>
      <stop offset="1" stop-color="#102C25"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="23.5" stroke="#EAF1DE" stroke-opacity=".13"/>

  <!-- The mark uses the same branching structure as the workflow graph. -->
  <g transform="translate(64 56)">
    <rect width="52" height="52" rx="14" fill="#EAF1DE" fill-opacity=".08" stroke="#BED7A4" stroke-opacity=".25"/>
    <path d="M26 42V29M26 29H12V17M26 29V12M26 29H40V17" stroke="#BED7A4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="7" y="10" width="10" height="10" rx="3.5" fill="#EAF1DE"/>
    <rect x="21" y="5" width="10" height="10" rx="3.5" fill="#BCD6A3"/>
    <rect x="35" y="10" width="10" height="10" rx="3.5" fill="#EAF1DE"/>
    <rect x="21" y="24" width="10" height="10" rx="3.5" fill="#EAF1DE"/>
    <circle cx="26" cy="43" r="4" fill="#D4AC68"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="185" fill="#F1F4E9" font-size="57" font-weight="650" letter-spacing="-2">NodeOrchard</text>
    <text x="66" y="227" fill="#BED1BF" font-size="23" font-weight="400">Local-first AI workflows</text>
    <g fill="#D6E2D0" font-size="13" font-weight="500" letter-spacing=".2">
      <rect x="64" y="268" width="68" height="29" rx="14.5" fill="#EAF1DE" fill-opacity=".07" stroke="#BED7A4" stroke-opacity=".2"/>
      <text x="98" y="287" text-anchor="middle">Skills</text>
      <rect x="142" y="268" width="112" height="29" rx="14.5" fill="#EAF1DE" fill-opacity=".07" stroke="#BED7A4" stroke-opacity=".2"/>
      <text x="198" y="287" text-anchor="middle">Parallel runs</text>
      <rect x="264" y="268" width="132" height="29" rx="14.5" fill="#EAF1DE" fill-opacity=".07" stroke="#BED7A4" stroke-opacity=".2"/>
      <text x="330" y="287" text-anchor="middle">Human review</text>
    </g>
  </g>

  <!-- Orthogonal edges make the fan-out and review boundary explicit. -->
  <g stroke="#769A7F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M672 180H726V84H794"/>
    <path d="M672 180H794"/>
    <path d="M672 180H726V276H794"/>
    <path d="M946 84H1004V180H1060"/>
    <path d="M946 180H1060"/>
    <path d="M946 276H1004V180H1060"/>
  </g>
  <g fill="#BED7A4">
    <circle cx="726" cy="180" r="4"/>
    <circle cx="1004" cy="180" r="4"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="586" y="145" width="86" height="70" rx="14" fill="#1E4939" stroke="#719877"/>
    <path d="M622 162L633 173L622 184M610 173H633" stroke="#DCE6D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="629" y="202" fill="#DCE6D2" font-size="12" font-weight="500" text-anchor="middle">Input</text>

    <rect x="794" y="54" width="152" height="60" rx="12" fill="#234B3A" stroke="#8CAF85"/>
    <rect x="808" y="70" width="28" height="28" rx="8" fill="#BED7A4" fill-opacity=".13"/>
    <path d="M815 84L820 89L829 79" stroke="#BCD6A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="850" y="89" fill="#EAF1DE" font-size="15" font-weight="550">Skill</text>

    <rect x="794" y="150" width="152" height="60" rx="12" fill="#203F3C" stroke="#739D9A"/>
    <rect x="808" y="166" width="28" height="28" rx="8" fill="#A3CECA" fill-opacity=".12"/>
    <path d="M818 175L813 180L818 185M826 175L831 180L826 185" stroke="#A3CECA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="850" y="185" fill="#EAF1DE" font-size="15" font-weight="550">Tool</text>

    <rect x="794" y="246" width="152" height="60" rx="12" fill="#234B3A" stroke="#8CAF85"/>
    <rect x="808" y="262" width="28" height="28" rx="8" fill="#BED7A4" fill-opacity=".13"/>
    <path d="M815 276L820 281L829 271" stroke="#BCD6A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="850" y="281" fill="#EAF1DE" font-size="15" font-weight="550">Skill</text>

    <rect x="1060" y="139" width="148" height="82" rx="14" fill="#3B3E2B" stroke="#BCA270"/>
    <circle cx="1134" cy="162" r="8" stroke="#DDC28B" stroke-width="1.7"/>
    <path d="M1124 184C1124 176 1144 176 1144 184" stroke="#DDC28B" stroke-width="1.7" stroke-linecap="round"/>
    <text x="1134" y="205" fill="#EEE6D3" font-size="14" font-weight="550" text-anchor="middle">Human review</text>
  </g>
</svg>
